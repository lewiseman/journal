name: journal
description: "The Journal App"

publish_to: "none"

version: 0.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  googleapis: ^13.2.0
  google_sign_in: ^6.2.2
  flutter_riverpod: ^3.4.3
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sync_wise:
    path: packages/sync_wise
  uuid: ^4.6.0
  flutter_markdown_plus: ^1.0.12
  html: 0.15.7
  csslib: 1.0.2
  markdown: 7.3.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_popup: ^3.3.9
  cached_network_image: ^4.0.5
  image_picker: ^1.2.4
  video_player: ^2.14.1
  file_picker: ^13.1.0
  objectbox: ^6.0.0-preview.4
  objectbox_flutter_libs: ^6.0.0-preview.4
  open_filex: ^5.0.0
  mime: ^2.0.0
  cryptography: 2.9.0
  flutter_secure_storage: 11.2.0
  mobile_scanner: 7.4.2
  bonsoir: 7.1.6
  flutter_tts: ^4.2.5
  webview_flutter: ^4.14.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  objectbox_generator: ^6.0.0-preview.4
  video_player_platform_interface: ^6.9.0

objectbox:
  output_dir: objectbox

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/images/
    - assets/images/navigation/
    - assets/images/onboarding/
    - assets/fonts/caveat-OFL.txt
    - assets/fonts/lora-OFL.txt
  shaders:
    - shaders/wabi_sabi.frag
    - shaders/stacked_alpha.frag
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Medium.ttf
          weight: 500
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
