// Delete this file and its apply line to remove QVAC from Android.
def qvacReady = file('src/qvac/libs/bare-kit.jar').exists()
def splitPerAbi = project.findProperty('split-per-abi')?.toString()?.toBoolean() ?: false
if (qvacReady && splitPerAbi && project.findProperty('target-platform')?.toString() != 'android-arm64') {
    throw new GradleException('QVAC supports arm64-v8a only. Build with --split-per-abi --target-platform=android-arm64.')
}
if (qvacReady) project.ext.set('disable-abi-filtering', true)
android {
    sourceSets {
        main {
            if (qvacReady) {
                jniLibs.srcDir 'src/qvac/jniLibs'
                assets.srcDir 'src/qvac/assets'
            } else { java.exclude '**/qvac/**' }
        }
    }
    if (qvacReady) {
        buildTypes {
            release {
                proguardFile project.file('barekit-rules.pro')
            }
        }
        defaultConfig {
            minSdkVersion 29
            // Gradle forbids NDK ABI filters alongside APK ABI splits.
            ndk { abiFilters.clear(); if (!splitPerAbi) abiFilters.add('arm64-v8a') }
        }
    }
}
if (qvacReady) dependencies { implementation files('src/qvac/libs/bare-kit.jar') }
